name: ci
on:
  pull_request:
  push:
    branches: [main, redesign/v2]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - name: Upload relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Sobe o servidor para o contrato HTTP
        run: |
          npm run start &
          npx --yes wait-on@9.1.0 -t 60000 http://localhost:3000
      - name: Contrato HTTP — asserções que já devem passar
        run: BASE_URL=http://localhost:3000 npx playwright test -c playwright.contract.config.ts -g "headers de segurança|rota inexistente"
      - name: Contrato HTTP — rotas ainda não implementadas
        # Remover continue-on-error ao concluir a tarefa 8.7 (todas as rotas existirem)
        continue-on-error: true
        run: BASE_URL=http://localhost:3000 npx playwright test -c playwright.contract.config.ts --grep-invert "headers de segurança|rota inexistente"
  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx @lhci/cli@0.15.1 autorun
      - name: Upload resultados do Lighthouse em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          retention-days: 7
